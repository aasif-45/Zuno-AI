name: Deploy Zuno AI to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECS_CLUSTER: my-ai-cluster
  ECS_SERVICE: my-ai-service
  S3_BUCKET: myai-demo1
  CLOUDFRONT_DISTRIBUTION_ID: ED6NUYKT6EJ1M

jobs:
  # ============================================================
  # 1. BUILD & DEPLOY BACKEND MICROSERVICES TO ECS (ap-south-1)
  # ============================================================
  deploy-backend:
    name: Build & Deploy Backend Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Build, Tag & Push Microservice Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd backend
          
          # Gateway
          docker build -f gateway/Dockerfile -t $REGISTRY/ai-gateway:latest .
          docker push $REGISTRY/ai-gateway:latest

          # Auth Service
          docker build -f services/auth/Dockerfile -t $REGISTRY/ai-auth:latest .
          docker push $REGISTRY/ai-auth:latest

          # Chat Service
          docker build -f services/chat/Dockerfile -t $REGISTRY/ai-chat:latest .
          docker push $REGISTRY/ai-chat:latest

          # Agent Service
          docker build -f services/agent/Dockerfile -t $REGISTRY/ai-agent:latest .
          docker push $REGISTRY/ai-agent:latest

          # Billing Service
          docker build -f services/Billing/Dockerfile -t $REGISTRY/ai-billing:latest .
          docker push $REGISTRY/ai-billing:latest

      - name: Force New ECS Deployment (ap-south-1)
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment --region ${{ env.AWS_REGION }}

  # ============================================================
  # 2. BUILD & DEPLOY FRONTEND TO S3 & CLOUDFRONT
  # ============================================================
  deploy-frontend:
    name: Build & Deploy Frontend to S3
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies & Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: |
          cd frontend
          npm install
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Build to S3
        run: |
          aws s3 sync frontend/dist s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
